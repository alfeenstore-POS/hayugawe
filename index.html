<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HayuGawe - Pekerjaan Desa, Rezeki Urang Sadaya</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #f9fafb; -webkit-tap-highlight-color: transparent; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect } = React;
        const { createClient } = supabase;

        // ==========================================
        // KONFIGURASI SUPABASE
        // ==========================================
        const SUPABASE_URL = 'https://hbjdfypmythzdkxslsnz.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_BCHCFk7E9zbJTqiwsn5DRQ_aDSQALa9';
        
        const isDbReady = SUPABASE_URL !== 'URL_SUPABASE_ANDA' && SUPABASE_URL.startsWith('http');
        const db = isDbReady ? createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        // ==========================================
        // IKON-IKON SVG
        // ==========================================
        const IconHome = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>);
        const IconUsers = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>);
        const IconBriefcase = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>);
        const IconUser = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>);
        const IconUserPlus = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>);
        const IconPhone = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>);
        const IconMapPin = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>);
        const IconPlusCircle = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>);
        const IconX = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>);
        const IconStar = ({size=24, className="", filled=false}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={filled ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>);
        const IconSearch = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>);
        const IconShield = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>);
        const IconCamera = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>);
        const IconMegaphone = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>);

        // ==========================================
        // APLIKASI UTAMA (REACT)
        // ==========================================
        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [authData, setAuthData] = useState({ phone: '', password: '', role: 'Pekerja / Pencari Kerja' });
            const [userProfile, setUserProfile] = useState({});
            
            const [allProfiles, setAllProfiles] = useState([]);
            const [workers, setWorkers] = useState([]);
            const [jobs, setJobs] = useState([]);
            const [ads, setAds] = useState([]);
            
            const [activeTab, setActiveTab] = useState('home');
            const [message, setMessage] = useState(null);
            
            const [searchWorker, setSearchWorker] = useState('');
            const [activeFilter, setActiveFilter] = useState('Semua');
            const filterCategories = ['Semua', 'Mencangkul', 'Ngarit', 'Panen', 'Bangunan', 'Bersih-bersih'];

            // Tambahkan State quota untuk pembuatan pekerjaan baru
            const [showAddJob, setShowAddJob] = useState(false);
            const [newJob, setNewJob] = useState({ title: '', wage: '', location: '', quota: 1 });
            
            const [showAddAd, setShowAddAd] = useState(false);
            const [newAd, setNewAd] = useState({ title: '', description: '', provider_name: '', phone: '', price: '', tier: 'Dasar' });
            
            const [showRatingModal, setShowRatingModal] = useState(false);
            const [ratingValue, setRatingValue] = useState(5);
            const [ratingTarget, setRatingTarget] = useState({ type: null, name: null, job_id: null });

            const [showEditProfile, setShowEditProfile] = useState(false);
            const [editProfileData, setEditProfileData] = useState({});

            const showNotification = (text) => {
                setMessage(text);
                setTimeout(() => setMessage(null), 3500);
            };

            useEffect(() => {
                fetchData();
            }, []);

            const fetchData = async () => {
                if (isDbReady) {
                    try {
                        const { data: allPData } = await db.from('profiles').select('*');
                        if (allPData) {
                            setAllProfiles(allPData);
                            setWorkers(allPData.filter(p => p.role === 'Pekerja / Pencari Kerja'));
                        }

                        const { data: jobsData } = await db.from('jobs').select('*').order('created_at', { ascending: false });
                        if (jobsData) setJobs(jobsData);

                        const { data: adsData } = await db.from('ads').select('*').order('created_at', { ascending: false });
                        if (adsData) setAds(adsData);
                    } catch (error) {
                        console.error('Gagal memuat data DB:', error);
                    }
                } else {
                    const dummyProfiles = [
                        { id: 1, name: 'Pak Budi', skill: 'Mencangkul, Tanam Padi', location: 'Dusun Krajan', status: 'Tersedia', phone: '081111', password: '123', rating: 4.8, reviews_count: 12, role: 'Pekerja / Pencari Kerja' },
                        { id: 2, name: 'Kang Agus', skill: 'Ngabangun, Tukang', location: 'Dusun Sari', status: 'Sedang / Akan Bekerja', phone: '082222', password: '123', rating: 5.0, reviews_count: 5, role: 'Pekerja / Pencari Kerja' },
                        { id: 3, name: 'Bu Siti', skill: 'Panen, Masak', location: 'Dusun Krajan', status: 'Tersedia', phone: '083333', password: '123', rating: 4.9, reviews_count: 20, role: 'Pekerja / Pencari Kerja' },
                        { id: 4, name: 'Pak Kades', location: 'Balai Desa', status: 'Tersedia', phone: '084444', password: '123', role: 'Penyedia Kerja' }
                    ];
                    setAllProfiles(dummyProfiles);
                    setWorkers(dummyProfiles.filter(p => p.role === 'Pekerja / Pencari Kerja'));
                    
                    setJobs([
                        { id: 101, title: 'Butuh Panen Padi', provider_name: 'Pak Kades', wage: 'Rp 100.000 / hari', location: 'Sawah Blok C', status: 'Tersedia', quota: 4, joined_count: 1, joined_workers: [{id: 2, name: 'Kang Agus'}], created_at: new Date().toISOString() },
                        { id: 102, title: 'Bantu Ngecor Jalan', provider_name: 'Mas Joko', wage: 'Rp 120.000 / hari', location: 'Proyek Balai Desa', status: 'Selesai', quota: 2, joined_count: 2, joined_workers: [], created_at: new Date().toISOString() },
                    ]);

                    setAds([
                        { id: 1, title: 'Sewa Traktor Pak Haji', description: 'Traktor siap pakai, sudah termasuk bensin dan operator.', provider_name: 'Pak Haji', phone: '0812345678', price: 'Rp 50.000/jam', tier: 'Tertatas', status: 'Aktif' },
                        { id: 2, title: 'Jasa Angkut Barang (Pickup)', description: 'Sedia mobil bak terbuka untuk angkut gabah/pindahan.', provider_name: 'Kang Ujang', phone: '088888888', price: 'Nego', tier: 'Pertengahan', status: 'Aktif' },
                        { id: 3, title: 'Jual Bibit Padi Unggul', description: 'Bibit padi varietas tahan hama.', provider_name: 'KUD Desa', phone: '089999999', price: 'Rp 10.000/kg', tier: 'Dasar', status: 'Aktif' },
                    ]);
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                if (!authData.phone || !authData.password) {
                    showNotification('Harap isi Nomor WA dan Kata Sandi!');
                    return;
                }

                let appliedRole = authData.role;
                if (authData.phone === '212212' && authData.password === '001122') {
                    appliedRole = 'Admin';
                }

                if (isDbReady) {
                    const { data, error } = await db.from('profiles').select('*').eq('phone', authData.phone).single();
                    
                    if (data) {
                        if (data.password === authData.password) {
                            setUserProfile({...data, role: appliedRole});
                        } else {
                            showNotification('Nomor WA atau Kata Sandi salah!');
                            return;
                        }
                    } else {
                        const nameToUse = appliedRole === 'Admin' ? 'Pengelola Desa' : 'Pengguna Baru';
                        const newUser = {
                            name: nameToUse,
                            phone: authData.phone,
                            password: authData.password,
                            role: appliedRole,
                            status: 'Tersedia',
                            rating: 5.0,
                            reviews_count: 0
                        };
                        const { data: insertedData } = await db.from('profiles').insert([newUser]).select().single();
                        if (insertedData) setUserProfile(insertedData);
                    }
                } else {
                    if (appliedRole === 'Admin') {
                        setUserProfile({
                            id: 'admin-secret',
                            name: 'Pengelola Desa',
                            phone: '212212',
                            password: '001122',
                            role: 'Admin',
                            location: '-',
                            skill: '-',
                            status: 'Aktif',
                            rating: 5.0,
                            reviews_count: 0
                        });
                    } else {
                        const existingDummy = allProfiles.find(w => w.phone === authData.phone);
                        if (existingDummy) {
                            if (existingDummy.password === authData.password) {
                                setUserProfile(existingDummy);
                            } else {
                                showNotification('Nomor WA atau Kata Sandi salah!');
                                return;
                            }
                        } else {
                            setUserProfile({
                                id: 'dummy-' + Date.now(),
                                name: 'Pengguna Baru',
                                phone: authData.phone,
                                password: authData.password,
                                role: appliedRole,
                                location: '-',
                                skill: '-',
                                status: 'Tersedia',
                                rating: 5.0,
                                reviews_count: 0
                            });
                        }
                    }
                }
                
                setIsLoggedIn(true);
                setActiveTab(appliedRole === 'Admin' ? 'admin' : 'home');
                showNotification(appliedRole === 'Admin' ? 'Mode Admin Berhasil Diakses!' : `Login berhasil!`);
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setUserProfile({});
                setActiveTab('home');
                setAuthData({ phone: '', password: '', role: 'Pekerja / Pencari Kerja' });
                showNotification('Anda telah berhasil keluar.');
            };

            const handleSaveProfile = async (e) => {
                e.preventDefault();
                try {
                    if (isDbReady) {
                        const { id, created_at, ...updateData } = editProfileData;
                        const { error } = await db.from('profiles').update(updateData).eq('id', userProfile.id);
                        if (error) {
                            showNotification('Gagal menyimpan: ' + error.message);
                            console.error(error);
                            return;
                        }
                        setUserProfile({ ...userProfile, ...updateData });
                        fetchData();
                    } else {
                        setUserProfile({ ...userProfile, ...editProfileData });
                    }
                    setShowEditProfile(false);
                    showNotification('Data profil berhasil diperbarui!');
                } catch (err) {
                    showNotification('Terjadi kesalahan jaringan.');
                    console.error(err);
                }
            };

            const handlePhotoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    if (file.size > 3 * 1024 * 1024) {
                        showNotification('Ukuran foto terlalu besar (Maksimal 3MB)');
                        return;
                    }
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setEditProfileData({ ...editProfileData, avatar: reader.result });
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleAddJob = async (e) => {
                e.preventDefault();
                if (!newJob.title) return;
                
                const jobData = {
                    title: newJob.title,
                    provider_name: userProfile.name,
                    wage: newJob.wage || '-',
                    location: newJob.location || '-',
                    quota: newJob.quota || 1,
                    joined_count: 0,
                    joined_workers: [],
                    status: 'Tersedia'
                };

                if (isDbReady) {
                    jobData.provider_id = userProfile.id;
                    const { data, error } = await db.from('jobs').insert([jobData]).select().single();
                    if (data) setJobs([data, ...jobs]);
                } else {
                    jobData.id = Date.now();
                    jobData.created_at = new Date().toISOString();
                    setJobs([jobData, ...jobs]);
                }
                
                setShowAddJob(false);
                setNewJob({ title: '', wage: '', location: '', quota: 1 });
                showNotification(`Lowongan untuk ${jobData.quota} orang berhasil diposting!`);
            };

            const handleAddAd = async (e) => {
                e.preventDefault();
                if (!newAd.title) return;
                
                const adData = { ...newAd, status: 'Aktif' };

                if (isDbReady) {
                    const { data, error } = await db.from('ads').insert([adData]).select().single();
                    if (data) setAds([data, ...ads]);
                } else {
                    adData.id = Date.now();
                    adData.created_at = new Date().toISOString();
                    setAds([adData, ...ads]);
                }
                
                setShowAddAd(false);
                setNewAd({ title: '', description: '', provider_name: '', phone: '', price: '', tier: 'Dasar' });
                showNotification(`Iklan Paket ${adData.tier} berhasil ditayangkan!`);
            };

            const handleTakeJob = async (job) => {
                const currentCount = job.joined_count || 0;
                const quota = job.quota || 1;
                const workersList = job.joined_workers || [];
                
                if (currentCount >= quota) {
                    showNotification('Maaf, kuota pekerja sudah penuh.');
                    return;
                }

                // Menghitung berapa kali akun ini sudah bergabung di pekerjaan yang sama
                const myEntries = workersList.filter(w => w.id === userProfile.id).length;
                const displayName = myEntries > 0 ? `${userProfile.name} (Teman/Wakil)` : userProfile.name;

                const updatedCount = currentCount + 1;
                const updatedWorkers = [...workersList, { id: userProfile.id, name: displayName, phone: userProfile.phone }];
                const newStatus = updatedCount >= quota ? 'Penuh' : 'Tersedia';

                if (isDbReady) {
                    await db.from('jobs').update({ 
                        joined_count: updatedCount, 
                        joined_workers: updatedWorkers, 
                        status: newStatus 
                    }).eq('id', job.id);
                    await db.from('profiles').update({ status: 'Sedang / Akan Bekerja' }).eq('id', userProfile.id);
                    fetchData();
                } else {
                    setJobs(jobs.map(j => j.id === job.id ? { ...j, joined_count: updatedCount, joined_workers: updatedWorkers, status: newStatus } : j));
                }
                setUserProfile(prev => ({ ...prev, status: 'Sedang / Akan Bekerja' }));
                showNotification(`Berhasil! ${displayName} ditambahkan ke pekerjaan ini.`);
            };

            const handleFinishJob = async () => {
                const targetJobId = ratingTarget.job_id;
                
                if (isDbReady && targetJobId) {
                    // Update status pekerjaan jadi Selesai
                    if (ratingTarget.type === 'worker') {
                        await db.from('jobs').update({ status: 'Selesai' }).eq('id', targetJobId);
                        
                        // Membebaskan status semua pekerja yang bergabung di job ini
                        const relatedJob = jobs.find(j => j.id === targetJobId);
                        if (relatedJob && relatedJob.joined_workers && relatedJob.joined_workers.length > 0) {
                            const workerIds = relatedJob.joined_workers.map(w => w.id);
                            await db.from('profiles').update({ status: 'Tersedia' }).in('id', workerIds);
                        }
                    }

                    // Hanya pekerja yang memberi rating ke bos di prototipe ini, 
                    // tapi jika bos menilai pekerja, sistem rating tetap jalan ke ID pertama (simulasi)
                    const reviewerId = userProfile.id;
                    const reviewedId = ratingTarget.type === 'provider' ? jobs.find(j=>j.id===targetJobId)?.provider_id : jobs.find(j=>j.id===targetJobId)?.joined_workers[0]?.id;

                    if (reviewedId) {
                         await db.from('reviews').insert([{ job_id: targetJobId, reviewer_id: reviewerId, target_id: reviewedId, rating: ratingValue }]);
                    }
                    
                    if (ratingTarget.type === 'provider') {
                        await db.from('profiles').update({ status: 'Tersedia' }).eq('id', userProfile.id);
                    }
                    
                    fetchData();
                }

                setShowRatingModal(false);
                if (ratingTarget.type === 'provider') {
                    setUserProfile(prev => ({ ...prev, status: 'Tersedia' }));
                }
                showNotification(`Penilaian ${ratingValue} bintang telah dikirim. Terima kasih!`);
                setRatingValue(5);
            };

            const renderRating = (rating, reviews) => (
                <div className="flex items-center gap-1 mb-2">
                    <IconStar size={14} className="text-yellow-400" filled={true} />
                    <span className="text-sm font-bold text-gray-700">{Number(rating).toFixed(1)}</span>
                    <span className="text-xs text-gray-500">({reviews} ulasan)</span>
                </div>
            );

            const renderContent = () => {
                switch (activeTab) {
                    case 'admin':
                        const totalPekerja = allProfiles.filter(p => p.role === 'Pekerja / Pencari Kerja').length;
                        const totalPenyedia = allProfiles.filter(p => p.role === 'Penyedia Kerja').length;
                        const totalJobSelesai = jobs.filter(j => j.status === 'Selesai').length;
                        const totalIklanAktif = ads.filter(a => a.status === 'Aktif').length;
                        
                        return (
                            <div className="pb-24 md:pb-8 space-y-6">
                                <div className="flex justify-between items-center mb-6 border-b border-gray-200 pb-4">
                                    <div>
                                        <h2 className="text-2xl font-black text-gray-800">Dashboard Pengelola</h2>
                                        <p className="text-gray-500 text-sm">Pantau aktivitas dan statistik aplikasi HayuGawe.</p>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={() => setShowAddAd(true)} className="bg-yellow-500 text-yellow-900 px-4 py-2 rounded-lg font-bold text-sm hover:bg-yellow-600 hover:text-white flex items-center gap-1 shadow-sm">
                                            <IconMegaphone size={16} /> Input Iklan Baru
                                        </button>
                                        <button onClick={fetchData} className="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg font-bold text-sm hover:bg-gray-200">
                                            Refresh
                                        </button>
                                    </div>
                                </div>

                                {showAddAd && (
                                    <div className="bg-white p-6 rounded-3xl shadow-lg border-2 border-yellow-400 relative mb-6">
                                        <button onClick={() => setShowAddAd(false)} className="absolute top-5 right-5 text-gray-400 hover:text-gray-800"><IconX size={20} /></button>
                                        <div className="flex items-center gap-2 mb-4 text-yellow-600">
                                            <IconMegaphone size={24} />
                                            <h3 className="text-xl font-black text-gray-800">Input Jasa/Sewa Premium</h3>
                                        </div>
                                        <form onSubmit={handleAddAd} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div className="md:col-span-2">
                                                <label className="block text-sm font-bold text-gray-700 mb-1">Pilih Paket Bayar</label>
                                                <select required className="w-full p-3 border-2 border-gray-200 rounded-xl outline-none focus:border-yellow-500 bg-gray-50 font-bold" value={newAd.tier} onChange={e => setNewAd({...newAd, tier: e.target.value})}>
                                                    <option value="Tertatas">Tertatas (Rp 50.000) - Tampil di Beranda & Teratas</option>
                                                    <option value="Pertengahan">Pertengahan (Rp 20.000) - Tampil Menonjol</option>
                                                    <option value="Dasar">Dasar (Rp 10.000) - Tampil Standar</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1">Judul Jasa/Sewa</label>
                                                <input type="text" required placeholder="Cth: Sewa Mesin Babat" className="w-full p-3 border-2 border-gray-200 rounded-xl outline-none focus:border-yellow-500 bg-gray-50" value={newAd.title} onChange={e => setNewAd({...newAd, title: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1">Nama Pemilik/Usaha</label>
                                                <input type="text" required placeholder="Cth: KUD Makmur" className="w-full p-3 border-2 border-gray-200 rounded-xl outline-none focus:border-yellow-500 bg-gray-50" value={newAd.provider_name} onChange={e => setNewAd({...newAd, provider_name: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1">Nomor WA Pemilik</label>
                                                <input type="tel" required placeholder="Cth: 0812..." className="w-full p-3 border-2 border-gray-200 rounded-xl outline-none focus:border-yellow-500 bg-gray-50" value={newAd.phone} onChange={e => setNewAd({...newAd, phone: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1">Harga/Tarif</label>
                                                <input type="text" required placeholder="Cth: Rp 100rb/hari" className="w-full p-3 border-2 border-gray-200 rounded-xl outline-none focus:border-yellow-500 bg-gray-50" value={newAd.price} onChange={e => setNewAd({...newAd, price: e.target.value})} />
                                            </div>
                                            <div className="md:col-span-2">
                                                <label className="block text-sm font-bold text-gray-700 mb-1">Deskripsi Singkat</label>
                                                <textarea required rows="2" placeholder="Jelaskan fasilitas jasanya..." className="w-full p-3 border-2 border-gray-200 rounded-xl outline-none focus:border-yellow-500 bg-gray-50 resize-none" value={newAd.description} onChange={e => setNewAd({...newAd, description: e.target.value})}></textarea>
                                            </div>
                                            <div className="md:col-span-2 mt-2">
                                                <button type="submit" className="w-full bg-yellow-500 text-yellow-950 font-black py-4 rounded-xl hover:bg-yellow-600 hover:text-white transition shadow-md">Terbitkan Iklan</button>
                                            </div>
                                        </form>
                                    </div>
                                )}
                                
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex flex-col justify-center">
                                        <div className="text-gray-500 mb-1 font-bold text-xs uppercase tracking-wider">Total Pekerja</div>
                                        <div className="text-4xl font-black text-green-600">{totalPekerja}</div>
                                    </div>
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex flex-col justify-center">
                                        <div className="text-gray-500 mb-1 font-bold text-xs uppercase tracking-wider">Penyedia Kerja</div>
                                        <div className="text-4xl font-black text-blue-600">{totalPenyedia}</div>
                                    </div>
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex flex-col justify-center">
                                        <div className="text-gray-500 mb-1 font-bold text-xs uppercase tracking-wider">Total Lowongan</div>
                                        <div className="text-4xl font-black text-orange-600">{jobs.length}</div>
                                    </div>
                                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex flex-col justify-center">
                                        <div className="text-gray-500 mb-1 font-bold text-xs uppercase tracking-wider">Iklan Jasa Aktif</div>
                                        <div className="text-4xl font-black text-yellow-600">{totalIklanAktif}</div>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6">
                                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100">
                                        <h3 className="font-bold text-gray-800 mb-4 text-lg border-b border-gray-100 pb-3 flex items-center gap-2"><IconUsers size={20}/> Pengguna Terbaru</h3>
                                        <div className="space-y-3">
                                            {allProfiles.slice(0, 5).map(p => (
                                                <div key={p.id} className="flex justify-between items-center p-3 bg-gray-50 rounded-xl border border-gray-100">
                                                    <div>
                                                        <p className="font-bold text-sm text-gray-800">{p.name}</p>
                                                        <p className="text-xs text-gray-500">{p.phone} • {p.location}</p>
                                                    </div>
                                                    <span className={`text-[10px] px-3 py-1 rounded-full font-bold whitespace-nowrap ${p.role.includes('Pekerja') ? 'bg-green-100 text-green-700' : p.role === 'Admin' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}`}>
                                                        {p.role.includes('Pekerja') ? 'Pekerja' : p.role === 'Admin' ? 'Admin' : 'Penyedia'}
                                                    </span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-gray-100">
                                        <h3 className="font-bold text-gray-800 mb-4 text-lg border-b border-gray-100 pb-3 flex items-center gap-2"><IconBriefcase size={20}/> Lowongan Terbaru</h3>
                                        <div className="space-y-3">
                                            {jobs.slice(0, 5).map(j => (
                                                <div key={j.id} className="flex justify-between items-center p-3 bg-gray-50 rounded-xl border border-gray-100">
                                                    <div>
                                                        <p className="font-bold text-sm text-gray-800">{j.title}</p>
                                                        <p className="text-xs text-gray-500">Oleh: {j.provider_name}</p>
                                                    </div>
                                                    <span className={`text-[10px] px-3 py-1 rounded-full font-bold whitespace-nowrap ${j.status === 'Tersedia' ? 'bg-green-100 text-green-700' : j.status === 'Selesai' ? 'bg-gray-200 text-gray-700' : 'bg-orange-100 text-orange-700'}`}>
                                                        {j.status}
                                                    </span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );

                    case 'home':
                        const premiumAds = ads.filter(a => a.tier === 'Tertatas' && a.status === 'Aktif');

                        return (
                            <div className="space-y-6 pb-24 md:pb-8">
                                <div className="w-full rounded-3xl overflow-hidden shadow-sm bg-white border border-gray-100 flex items-center justify-center p-4">
                                    <img 
                                        src="https://raw.githubusercontent.com/alfeenstore-POS/hayugawe/refs/heads/main/hayugawe.png.png" 
                                        alt="Banner Hayu Gawe" 
                                        className="w-full h-auto object-contain max-h-[250px] md:max-h-[400px] rounded-2xl"
                                    />
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="md:col-span-2 bg-green-600 rounded-3xl p-8 text-white shadow-lg flex flex-col justify-center relative overflow-hidden">
                                        <div className="relative z-10">
                                            <h2 className="text-3xl md:text-4xl font-bold mb-3">
                                                Selamat Datang di <span className="text-green-900 bg-white/20 px-2 py-1 rounded-lg">Hayu</span><span className="text-yellow-400 drop-shadow-md">Gawe</span>
                                            </h2>
                                            <p className="text-green-100 mb-4 text-lg">Pekerjaan Desa, Rezeki Urang Sadaya. {isDbReady ? 'Terhubung ke Database ✅' : ''}</p>
                                            
                                            <div className="bg-green-800/50 border border-green-500/50 p-4 rounded-xl mb-6">
                                                <p className="text-green-50 text-sm leading-relaxed">
                                                    <span className="font-bold text-yellow-400">PENTING:</span> Aplikasi ini hanya merupakan PENGHUBUNG antara Pencari Kerja dan Penyedia Pekerjaan. Segala bentuk transaksi dilanjutkan oleh pihak masing-masing, sesuai kesepakatan secara bertanggung jawab.
                                                </p>
                                            </div>

                                            <div className="flex flex-col sm:flex-row gap-3">
                                                <button onClick={() => setActiveTab('workers')} className="bg-white text-green-700 px-6 py-3 rounded-xl font-bold hover:bg-gray-50 transition text-center shadow-sm">
                                                    Cari Pekerja
                                                </button>
                                                <button onClick={() => setActiveTab('jobs')} className="bg-green-800 text-white px-6 py-3 rounded-xl font-bold border border-green-500 hover:bg-green-900 transition text-center shadow-sm">
                                                    Cari Kerja
                                                </button>
                                            </div>
                                        </div>
                                        <div className="absolute -right-10 -bottom-10 opacity-10 transform rotate-12">
                                            <IconUsers size={200} />
                                        </div>
                                    </div>

                                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex flex-col justify-center">
                                        <h3 className="font-bold text-gray-800 mb-4 text-xl">Statistik Desa Hari Ini</h3>
                                        <div className="space-y-4">
                                            <div className="bg-green-50 p-4 rounded-2xl border border-green-100 flex items-center justify-between">
                                                <div>
                                                    <div className="text-sm text-green-800 font-medium mb-1">Pekerja Tersedia</div>
                                                    <div className="text-3xl font-black text-green-600">{workers.filter(w => w.status === 'Tersedia').length}</div>
                                                </div>
                                                <IconUsers size={40} className="text-green-200" />
                                            </div>
                                            <div className="bg-orange-50 p-4 rounded-2xl border border-orange-100 flex items-center justify-between">
                                                <div>
                                                    <div className="text-sm text-orange-800 font-medium mb-1">Lowongan Aktif</div>
                                                    <div className="text-3xl font-black text-orange-500">{jobs.filter(j => j.status === 'Tersedia').length}</div>
                                                </div>
                                                <IconBriefcase size={40} className="text-orange-200" />
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {premiumAds.length > 0 && (
                                    <div className="mt-8">
                                        <div className="flex items-center gap-2 mb-4 px-2">
                                            <IconStar size={20} className="text-yellow-500" filled={true} />
                                            <h3 className="text-xl font-black text-gray-800">Layanan Spesial Desa</h3>
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {premiumAds.map(ad => (
                                                <div key={ad.id} className="bg-gradient-to-r from-yellow-50 to-white p-5 rounded-3xl shadow-sm border border-yellow-200 flex flex-col sm:flex-row gap-4 items-center sm:items-start hover:shadow-md transition">
                                                    <div className="w-14 h-14 rounded-2xl bg-yellow-100 text-yellow-600 flex items-center justify-center shrink-0 border border-yellow-300">
                                                        <IconMegaphone size={28} />
                                                    </div>
                                                    <div className="flex-1 text-center sm:text-left">
                                                        <h4 className="font-bold text-lg text-gray-800">{ad.title}</h4>
                                                        <p className="text-sm text-gray-600 line-clamp-2 mt-1 mb-2">{ad.description}</p>
                                                        <div className="flex flex-col sm:flex-row items-center gap-2 sm:gap-4 mt-auto">
                                                            <span className="font-bold text-yellow-700 bg-yellow-100 px-3 py-1 rounded-lg text-xs">{ad.price}</span>
                                                            <button onClick={() => showNotification('Membuka WhatsApp...')} className="text-sm font-bold text-green-700 hover:text-green-800 flex items-center gap-1">
                                                                <IconPhone size={14} /> Hubungi {ad.provider_name}
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        );
                    
                    case 'workers':
                        const filteredWorkers = workers.filter(w => {
                            const skill = w.skill || '';
                            const name = w.name || '';
                            const matchSearch = skill.toLowerCase().includes(searchWorker.toLowerCase()) || name.toLowerCase().includes(searchWorker.toLowerCase());
                            const matchFilter = activeFilter === 'Semua' || skill.toLowerCase().includes(activeFilter.toLowerCase());
                            return matchSearch && matchFilter;
                        });

                        return (
                            <div className="pb-24 md:pb-8 space-y-6">
                                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                    <h2 className="text-2xl font-bold text-gray-800">Daftar Pekerja Desa</h2>
                                    <div className="relative shadow-sm w-full md:w-1/3">
                                        <IconSearch size={18} className="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400" />
                                        <input 
                                            type="text" placeholder="Cari keahlian (misal: panen)..." 
                                            className="w-full pl-11 pr-4 py-3 border border-gray-200 rounded-xl text-sm outline-none focus:border-green-500"
                                            value={searchWorker} onChange={(e) => setSearchWorker(e.target.value)}
                                        />
                                    </div>
                                </div>

                                <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                                    {filterCategories.map(cat => (
                                        <button key={cat} onClick={() => setActiveFilter(cat)}
                                            className={`px-5 py-2.5 rounded-full text-sm font-bold whitespace-nowrap ${activeFilter === cat ? 'bg-green-600 text-white' : 'bg-white text-gray-600 border border-gray-200'}`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {filteredWorkers.length > 0 ? filteredWorkers.map(worker => (
                                        <div key={worker.id} className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                            <div className="flex justify-between items-start mb-2">
                                                <div className="flex gap-3 items-center">
                                                    <div className="w-12 h-12 rounded-full bg-gray-100 border border-gray-200 overflow-hidden shrink-0 flex items-center justify-center">
                                                        {worker.avatar ? <img src={worker.avatar} className="w-full h-full object-cover" /> : <IconUser size={24} className="text-gray-400" />}
                                                    </div>
                                                    <div>
                                                        <h3 className="font-bold text-xl text-gray-800">{worker.name}</h3>
                                                        {renderRating(worker.rating, worker.reviews_count)}
                                                    </div>
                                                </div>
                                                <span className={`text-xs px-3 py-1.5 rounded-full font-bold ${worker.status === 'Tersedia' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}`}>
                                                    {worker.status}
                                                </span>
                                            </div>
                                            <div className="bg-gray-50 p-3 rounded-xl mt-3 mb-4">
                                                <p className="text-sm text-gray-700 flex items-start gap-2 mb-2">
                                                    <IconBriefcase size={16} className="text-green-600 shrink-0 mt-0.5" /> 
                                                    <span className="font-medium">{worker.skill || 'Belum diisi'}</span>
                                                </p>
                                                <p className="text-sm text-gray-600 flex items-center gap-2">
                                                    <IconMapPin size={16} className="text-gray-400 shrink-0" /> {worker.location || '-'}
                                                </p>
                                            </div>
                                            <button onClick={() => showNotification('Membuka WhatsApp...')}
                                                className="w-full bg-green-50 text-green-700 font-bold py-3 rounded-xl flex items-center justify-center gap-2 hover:bg-green-100"
                                            >
                                                <IconPhone size={18} /> Hubungi via WA
                                            </button>
                                        </div>
                                    )) : (
                                        <div className="col-span-full text-center py-12 bg-gray-50 rounded-2xl border-2 border-dashed border-gray-200">
                                            <p className="text-gray-500 font-medium">Tidak ada pekerja yang sesuai kriteria.</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        );

                    case 'jobs':
                        return (
                            <div className="pb-24 md:pb-8 space-y-6">
                                <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                                    <h2 className="text-2xl font-bold text-gray-800">Papan Lowongan Kerja</h2>
                                    {userProfile.role === 'Penyedia Kerja' && (
                                        <button onClick={() => setShowAddJob(true)}
                                            className="bg-green-600 text-white px-5 py-3 rounded-xl flex items-center justify-center gap-2 text-sm font-bold shadow-sm hover:bg-green-700"
                                        >
                                            <IconPlusCircle size={18} /> Buat Lowongan Baru
                                        </button>
                                    )}
                                </div>

                                {showAddJob && (
                                    <div className="bg-white p-6 rounded-2xl shadow-lg border border-green-200 relative mb-6">
                                        <button onClick={() => setShowAddJob(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><IconX size={24} /></button>
                                        <h3 className="text-xl font-bold text-green-700 mb-4">Tambah Lowongan Baru</h3>
                                        <form onSubmit={handleAddJob} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div className="md:col-span-2">
                                                <label className="block text-sm font-bold text-gray-700 mb-1.5">Judul Pekerjaan</label>
                                                <input type="text" placeholder="Contoh: Panen Padi Sawah Blok C" required className="w-full p-3 border border-gray-300 rounded-xl text-sm" value={newJob.title} onChange={e => setNewJob({...newJob, title: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1.5">Upah (Rp)</label>
                                                <input type="text" placeholder="Contoh: Rp 80.000 / hari" className="w-full p-3 border border-gray-300 rounded-xl text-sm" value={newJob.wage} onChange={e => setNewJob({...newJob, wage: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1.5">Kebutuhan (Orang)</label>
                                                <input type="number" min="1" required placeholder="Butuh berapa orang?" className="w-full p-3 border border-gray-300 rounded-xl text-sm" value={newJob.quota} onChange={e => setNewJob({...newJob, quota: parseInt(e.target.value) || 1})} />
                                            </div>
                                            <div className="md:col-span-2">
                                                <label className="block text-sm font-bold text-gray-700 mb-1.5">Lokasi Kerja</label>
                                                <input type="text" placeholder="Contoh: Sawah Belakang Balai Desa" className="w-full p-3 border border-gray-300 rounded-xl text-sm" value={newJob.location} onChange={e => setNewJob({...newJob, location: e.target.value})} />
                                            </div>
                                            <div className="md:col-span-2 mt-2">
                                                <button type="submit" className="w-full bg-green-600 text-white font-bold py-3.5 rounded-xl hover:bg-green-700 transition">Posting Pekerjaan</button>
                                            </div>
                                        </form>
                                    </div>
                                )}

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {jobs.map(job => {
                                        const currentCount = job.joined_count || 0;
                                        const quota = job.quota || 1;
                                        const isFull = currentCount >= quota || job.status === 'Penuh' || job.status === 'Selesai';
                                        
                                        // Cek berapa banyak kursi yang diambil oleh user ini
                                        const myJoinCount = (job.joined_workers || []).filter(w => w.id === userProfile.id).length;

                                        return (
                                            <div key={job.id} className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col">
                                                <div className="flex justify-between items-start mb-2">
                                                    <h3 className="font-bold text-xl text-gray-800">{job.title}</h3>
                                                    <span className={`text-xs px-3 py-1.5 rounded-full font-bold whitespace-nowrap ml-2 ${!isFull ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}`}>
                                                        {job.status === 'Selesai' ? 'Selesai' : isFull ? 'Penuh' : 'Tersedia'}
                                                    </span>
                                                </div>
                                                
                                                <div className="flex items-center gap-2 mb-4">
                                                    <div className="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center border border-gray-200">
                                                        <IconUser size={14} className="text-gray-500" />
                                                    </div>
                                                    <div>
                                                        <p className="text-sm text-gray-700 font-bold">{job.provider_name}</p>
                                                    </div>
                                                </div>
                                                
                                                <div className="bg-orange-50 p-3 rounded-xl border border-orange-100 mb-3 flex justify-between items-center">
                                                    <div>
                                                        <span className="block text-orange-800 font-bold text-xs uppercase mb-1">Upah</span>
                                                        <span className="text-orange-600 font-semibold">{job.wage}</span>
                                                    </div>
                                                    <div className="text-right">
                                                        <span className="block text-orange-800 font-bold text-xs uppercase mb-1">Kuota Terisi</span>
                                                        <span className="text-orange-600 font-black">{currentCount} / {quota} <span className="font-medium text-sm">Org</span></span>
                                                    </div>
                                                </div>

                                                <div className="bg-gray-50 p-3 rounded-xl mb-5 flex items-center gap-2">
                                                    <IconMapPin size={16} className="text-gray-400 shrink-0" /> 
                                                    <span className="text-sm text-gray-700 font-medium">{job.location}</span>
                                                </div>

                                                <div className="mt-auto">
                                                    {userProfile.role === 'Pekerja / Pencari Kerja' && !isFull && (
                                                        <button onClick={() => handleTakeJob(job)} className="w-full bg-green-600 text-white font-bold py-3 rounded-xl hover:bg-green-700 transition shadow-sm">
                                                            {myJoinCount > 0 ? `Daftarkan Teman Lain (+1)` : `Bergabung (${currentCount}/${quota})`}
                                                        </button>
                                                    )}
                                                    
                                                    {userProfile.role === 'Pekerja / Pencari Kerja' && myJoinCount > 0 && job.status !== 'Selesai' && (
                                                        <div className="text-center text-xs text-green-700 font-bold mt-3">
                                                            ✅ Anda mendaftarkan {myJoinCount} orang
                                                        </div>
                                                    )}

                                                    {userProfile.role === 'Pekerja / Pencari Kerja' && isFull && job.status !== 'Selesai' && (
                                                        <button disabled className="w-full bg-gray-100 text-gray-400 font-bold py-3 rounded-xl cursor-not-allowed">
                                                            Kuota Pekerja Penuh
                                                        </button>
                                                    )}

                                                    {userProfile.role !== 'Pekerja / Pencari Kerja' && job.status !== 'Selesai' && (
                                                        <button disabled className="w-full bg-gray-100 text-gray-400 font-bold py-3 rounded-xl cursor-not-allowed">
                                                            Pekerja: {currentCount}/{quota} Terisi
                                                        </button>
                                                    )}
                                                    
                                                    {job.status === 'Selesai' && (
                                                        <button disabled className="w-full bg-gray-100 text-gray-400 font-bold py-3 rounded-xl cursor-not-allowed">
                                                            Pekerjaan Telah Selesai
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        );

                    case 'ads':
                        const sortedAds = [...ads].sort((a, b) => {
                            const tiers = { 'Tertatas': 1, 'Pertengahan': 2, 'Dasar': 3 };
                            return tiers[a.tier] - tiers[b.tier];
                        });

                        return (
                            <div className="pb-24 md:pb-8 space-y-6">
                                <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4 border-b border-gray-200 pb-4">
                                    <div>
                                        <h2 className="text-2xl font-bold text-gray-800 flex items-center gap-2"><IconMegaphone size={24} className="text-yellow-500" /> Jasa & Sewa Desa</h2>
                                        <p className="text-gray-500 text-sm mt-1">Butuh sewa traktor, mobil angkut, atau jasa khusus? Cari di sini!</p>
                                    </div>
                                    <button onClick={() => showNotification('Untuk pasang iklan, silakan hubungi Pengelola Desa (Admin) via WhatsApp.')} className="bg-yellow-50 text-yellow-700 border border-yellow-200 px-4 py-2 rounded-xl text-sm font-bold hover:bg-yellow-100 transition">
                                        Pasang Iklan Anda
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {sortedAds.filter(a => a.status === 'Aktif').map(ad => {
                                        let cardStyle = "bg-white border-gray-100";
                                        let badgeStyle = "bg-gray-100 text-gray-600";
                                        let iconStyle = "bg-gray-50 text-gray-400 border-gray-100";
                                        
                                        if (ad.tier === 'Tertatas') {
                                            cardStyle = "bg-gradient-to-br from-yellow-50 to-white border-yellow-300 shadow-md transform hover:-translate-y-1";
                                            badgeStyle = "bg-yellow-500 text-white shadow-sm";
                                            iconStyle = "bg-yellow-100 text-yellow-600 border-yellow-200";
                                        } else if (ad.tier === 'Pertengahan') {
                                            cardStyle = "bg-gradient-to-br from-blue-50 to-white border-blue-200 shadow-sm";
                                            badgeStyle = "bg-blue-500 text-white";
                                            iconStyle = "bg-blue-100 text-blue-600 border-blue-200";
                                        }

                                        return (
                                            <div key={ad.id} className={`p-6 rounded-3xl border-2 transition-all flex flex-col ${cardStyle}`}>
                                                <div className="flex justify-between items-start mb-4">
                                                    <div className={`w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 border ${iconStyle}`}>
                                                        <IconMegaphone size={24} />
                                                    </div>
                                                    {ad.tier === 'Tertatas' && (
                                                        <span className={`text-[10px] px-3 py-1 rounded-full font-bold tracking-wider uppercase flex items-center gap-1 ${badgeStyle}`}>
                                                            <IconStar size={10} filled={true} /> Premium
                                                        </span>
                                                    )}
                                                    {ad.tier === 'Pertengahan' && (
                                                        <span className={`text-[10px] px-3 py-1 rounded-full font-bold tracking-wider uppercase ${badgeStyle}`}>Sorotan</span>
                                                    )}
                                                </div>
                                                <h3 className="font-bold text-xl text-gray-800 leading-tight mb-2">{ad.title}</h3>
                                                <p className="text-sm text-gray-600 mb-4 flex-grow">{ad.description}</p>
                                                
                                                <div className="bg-white/60 p-3 rounded-xl border border-gray-200/50 mb-4">
                                                    <p className="text-xs text-gray-500 font-bold uppercase mb-1">Penyedia / Pemilik</p>
                                                    <p className="font-bold text-gray-800">{ad.provider_name}</p>
                                                </div>

                                                <div className="flex items-center justify-between mt-auto pt-2">
                                                    <span className="font-black text-lg text-gray-800">{ad.price}</span>
                                                    <button onClick={() => showNotification(`Membuka WhatsApp ${ad.provider_name}...`)} className="bg-green-600 text-white p-3 rounded-xl hover:bg-green-700 shadow-sm transition">
                                                        <IconPhone size={18} />
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        );

                    case 'profile':
                        // Logika dinamis untuk mencari proyek aktif milik user
                        let myActiveWorkerJob = null;
                        let myActiveProviderJob = null;

                        if (userProfile.role === 'Pekerja / Pencari Kerja') {
                            myActiveWorkerJob = jobs.find(j => j.joined_workers && j.joined_workers.some(w => w.id === userProfile.id) && j.status !== 'Selesai');
                        } else if (userProfile.role === 'Penyedia Kerja') {
                            myActiveProviderJob = jobs.find(j => j.provider_name === userProfile.name && j.status !== 'Selesai' && (j.joined_count || 0) > 0);
                        }

                        return (
                            <div className="pb-24 md:pb-8">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-bold text-gray-800">Profil Saya</h2>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="md:col-span-1 space-y-6">
                                        {(userProfile.name === 'Pengguna Baru' || !userProfile.avatar) && userProfile.role !== 'Admin' && (
                                            <div className="bg-yellow-50 border border-yellow-200 p-4 rounded-2xl text-sm text-yellow-800 shadow-sm animate-pulse">
                                                <span className="font-bold">⚠️ Perhatian:</span> Anda diwajibkan mengatur Nama Lengkap dan <b>mengunggah Foto Profil</b>. Silakan klik <b>Ubah Data Profil</b> di bawah.
                                            </div>
                                        )}
                                        <div className="bg-white rounded-3xl p-8 shadow-sm border border-gray-100 text-center relative overflow-hidden">
                                            <div className="absolute top-0 left-0 w-full h-24 bg-green-600"></div>
                                            <div className="relative w-32 h-32 bg-white rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-white shadow-lg mt-4 z-10 overflow-hidden">
                                                {userProfile.avatar ? (
                                                    <img src={userProfile.avatar} alt="Foto Profil" className="w-full h-full object-cover" />
                                                ) : (
                                                    <IconUser size={60} className="text-gray-300" />
                                                )}
                                            </div>
                                            <h3 className="text-2xl font-black text-gray-800">{userProfile.name}</h3>
                                            
                                            <div className="flex items-center justify-center gap-1 my-3 bg-yellow-50 mx-auto w-max px-4 py-1.5 rounded-full border border-yellow-100">
                                                <IconStar size={18} className="text-yellow-400" filled={true} />
                                                <span className="text-lg font-bold text-yellow-700">{Number(userProfile.rating || 5).toFixed(1)}</span>
                                                <span className="text-sm text-yellow-600 font-medium ml-1">({userProfile.reviews_count || 0} ulasan)</span>
                                            </div>

                                            <div className="flex flex-col gap-2 mt-4">
                                                <span className="inline-block bg-green-50 text-green-800 px-4 py-2 rounded-xl font-bold border border-green-100">{userProfile.role}</span>
                                                <span className={`inline-block px-4 py-2 rounded-xl font-bold border ${userProfile.status === 'Tersedia' ? 'bg-blue-50 text-blue-700 border-blue-200' : 'bg-orange-50 text-orange-700 border-orange-200'}`}>
                                                    Status: {userProfile.status}
                                                </span>
                                            </div>
                                        </div>

                                        <div className="bg-white rounded-3xl shadow-sm border border-gray-100 p-6 space-y-5">
                                            <h4 className="font-bold text-gray-800 border-b border-gray-100 pb-3">Informasi Detail</h4>
                                            {userProfile.role === 'Pekerja / Pencari Kerja' && (
                                                <div>
                                                    <label className="text-xs text-gray-500 font-bold uppercase">Keahlian Saya</label>
                                                    <p className="text-gray-800 font-medium mt-1 bg-gray-50 p-3 rounded-lg border border-gray-100">{userProfile.skill || '-'}</p>
                                                </div>
                                            )}
                                            <div>
                                                <label className="text-xs text-gray-500 font-bold uppercase">Lokasi Domisili</label>
                                                <p className="text-gray-800 font-medium mt-1 bg-gray-50 p-3 rounded-lg border border-gray-100">{userProfile.location || '-'}</p>
                                            </div>
                                            <div>
                                                <label className="text-xs text-gray-500 font-bold uppercase">Nomor WhatsApp</label>
                                                <p className="text-gray-800 font-medium mt-1 bg-gray-50 p-3 rounded-lg border border-gray-100">{userProfile.phone || '-'}</p>
                                            </div>
                                            
                                            <button onClick={() => { setEditProfileData(userProfile); setShowEditProfile(true); }} className="w-full mt-4 bg-white border-2 border-green-600 text-green-700 font-bold py-3 rounded-xl hover:bg-green-50 transition">
                                                Ubah Data Profil
                                            </button>
                                            <button onClick={handleLogout} className="w-full mt-3 bg-red-50 text-red-600 font-bold py-3 rounded-xl hover:bg-red-100 transition">
                                                Keluar Akun
                                            </button>
                                        </div>
                                    </div>

                                    {/* Kolom Kanan: Aktivitas Aktif */}
                                    <div className="md:col-span-2 space-y-6">
                                        <div className="bg-white rounded-3xl shadow-sm border border-gray-100 p-6 min-h-[400px]">
                                            <h3 className="text-xl font-bold text-gray-800 mb-6 border-b border-gray-100 pb-4">Aktivitas Saat Ini</h3>

                                            {userProfile.role === 'Pekerja / Pencari Kerja' && myActiveWorkerJob && (
                                                <div className="bg-orange-50 border border-orange-200 rounded-2xl p-6 shadow-sm relative overflow-hidden">
                                                    <div className="absolute top-0 left-0 w-2 h-full bg-orange-500"></div>
                                                    <h4 className="font-bold text-orange-800 text-sm uppercase mb-4 bg-orange-100 px-3 py-1 rounded-full w-max">Sedang Bergabung</h4>
                                                    <p className="font-black text-gray-800 text-2xl mb-2">{myActiveWorkerJob.title}</p>
                                                    <p className="text-gray-600 mb-6">Penyedia: <strong>{myActiveWorkerJob.provider_name}</strong></p>
                                                    <button onClick={() => { setRatingTarget({ type: 'provider', name: myActiveWorkerJob.provider_name, job_id: myActiveWorkerJob.id }); setShowRatingModal(true); }}
                                                        className="w-full sm:w-auto bg-orange-600 text-white font-bold py-3 px-8 rounded-xl hover:bg-orange-700 shadow-md transition"
                                                    >
                                                        Beri Rating Penyedia (Tugas Selesai)
                                                    </button>
                                                </div>
                                            )}

                                            {userProfile.role === 'Penyedia Kerja' && myActiveProviderJob && (
                                                <div className="bg-blue-50 border border-blue-200 rounded-2xl p-6 shadow-sm relative overflow-hidden">
                                                    <div className="absolute top-0 left-0 w-2 h-full bg-blue-500"></div>
                                                    <div className="flex justify-between items-start mb-4">
                                                        <h4 className="font-bold text-blue-800 text-sm uppercase bg-blue-100 px-3 py-1 rounded-full w-max">Proyek Berjalan</h4>
                                                        <span className="font-bold text-blue-600 text-sm">{myActiveProviderJob.joined_count} / {myActiveProviderJob.quota} Pekerja</span>
                                                    </div>
                                                    <p className="font-black text-gray-800 text-2xl mb-4">{myActiveProviderJob.title}</p>
                                                    
                                                    <div className="bg-white p-4 rounded-xl border border-blue-100 mb-6">
                                                        <p className="text-xs text-gray-500 font-bold uppercase mb-2">Daftar Pekerja Tergabung:</p>
                                                        <div className="space-y-2">
                                                            {myActiveProviderJob.joined_workers && myActiveProviderJob.joined_workers.map((w, idx) => (
                                                                <div key={idx} className="flex justify-between items-center text-sm">
