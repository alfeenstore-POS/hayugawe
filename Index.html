<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HayuGawe - Pekerjaan Desa, Rezeki Urang Sadaya</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (Untuk membaca JSX di browser tanpa proses build) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Sembunyikan scrollbar untuk kategori */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: #f9fafb; -webkit-tap-highlight-color: transparent; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect } = React;
        const { createClient } = supabase;

        // ==========================================
        // KONFIGURASI SUPABASE (GANTI KODE DI BAWAH INI NANTI)
        // ==========================================
        const SUPABASE_URL = 'https://hbjdfypmythzdkxslsnz.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_BCHCFk7E9zbJTqiwsn5DRQ_aDSQALa9';
        
        // Cek apakah Supabase sudah diisi atau masih bawaan (placeholder)
        const isDbReady = SUPABASE_URL !== 'URL_SUPABASE_ANDA' && SUPABASE_URL.startsWith('http');
        const db = isDbReady ? createClient(SUPABASE_URL, SUPABASE_KEY) : null;

        // ==========================================
        // IKON-IKON SVG (Mandiri tanpa install library)
        // ==========================================
        const IconHome = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>);
        const IconUsers = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>);
        const IconBriefcase = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>);
        const IconUser = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>);
        const IconUserPlus = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>);
        const IconPhone = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>);
        const IconMapPin = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>);
        const IconPlusCircle = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>);
        const IconX = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>);
        const IconStar = ({size=24, className="", filled=false}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={filled ? "currentColor" : "none"} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>);
        const IconSearch = ({size=24, className=""}) => (<svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>);

        // ==========================================
        // APLIKASI UTAMA (REACT)
        // ==========================================
        function App() {
            // State Autentikasi
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [authData, setAuthData] = useState({ name: '', phone: '', role: 'Pekerja / Pencari Kerja' });
            const [userProfile, setUserProfile] = useState({});
            
            // State Data
            const [workers, setWorkers] = useState([]);
            const [jobs, setJobs] = useState([]);
            const [dbStatusMsg, setDbStatusMsg] = useState(isDbReady ? 'Terkoneksi ke Database' : 'Mode Offline (Supabase Belum Diatur)');
            
            // State UI
            const [activeTab, setActiveTab] = useState('home');
            const [message, setMessage] = useState(null);
            
            // State Filter Pekerja
            const [searchWorker, setSearchWorker] = useState('');
            const [activeFilter, setActiveFilter] = useState('Semua');
            const filterCategories = ['Semua', 'Mencangkul', 'Ngarit', 'Panen', 'Bangunan', 'Bersih-bersih'];

            // State Pekerjaan
            const [showAddJob, setShowAddJob] = useState(false);
            const [newJob, setNewJob] = useState({ title: '', wage: '', location: '' });
            
            // State Rating & Aktivitas
            const [activeJob, setActiveJob] = useState(null); // Utk Pekerja
            const [activeProviderJob, setActiveProviderJob] = useState(null); // Utk Bos
            const [showRatingModal, setShowRatingModal] = useState(false);
            const [ratingValue, setRatingValue] = useState(5);
            const [ratingTarget, setRatingTarget] = useState({ type: null, name: null });

            // State Edit Profil
            const [showEditProfile, setShowEditProfile] = useState(false);
            const [editProfileData, setEditProfileData] = useState({});

            const showNotification = (text) => {
                setMessage(text);
                setTimeout(() => setMessage(null), 3500);
            };

            // Memuat Data Awal
            useEffect(() => {
                fetchData();
            }, []);

            const fetchData = async () => {
                if (isDbReady) {
                    try {
                        const { data: workersData } = await db.from('profiles').select('*').eq('role', 'Pekerja / Pencari Kerja');
                        if (workersData) setWorkers(workersData);

                        const { data: jobsData } = await db.from('jobs').select('*');
                        if (jobsData) setJobs(jobsData);
                    } catch (error) {
                        console.error('Gagal memuat data DB:', error);
                    }
                } else {
                    // DATA DUMMY JIKA SUPABASE BELUM ADA
                    setWorkers([
                        { id: 1, name: 'Pak Budi', skill: 'Mencangkul, Tanam Padi', location: 'Dusun Krajan', status: 'Tersedia', phone: '081111', rating: 4.8, reviews_count: 12 },
                        { id: 2, name: 'Kang Agus', skill: 'Ngabangun, Tukang', location: 'Dusun Sari', status: 'Sedang / Akan Bekerja', phone: '082222', rating: 5.0, reviews_count: 5 },
                        { id: 3, name: 'Bu Siti', skill: 'Panen, Masak', location: 'Dusun Krajan', status: 'Tersedia', phone: '083333', rating: 4.9, reviews_count: 20 },
                    ]);
                    setJobs([
                        { id: 101, title: 'Butuh 2 orang Panen Padi', provider_name: 'Pak Kades', wage: 'Rp 100.000 / hari', location: 'Sawah Blok C', status: 'Tersedia', created_at: new Date().toISOString() },
                        { id: 102, title: 'Bantu Ngecor Jalan', provider_name: 'Mas Joko', wage: 'Rp 120.000 / hari', location: 'Proyek Balai Desa', status: 'Tersedia', created_at: new Date().toISOString() },
                    ]);
                }
            };

            // FUNGSI: Login / Daftar
            const handleLogin = async (e) => {
                e.preventDefault();
                if (!authData.name || !authData.phone) return;

                if (isDbReady) {
                    // Cari pengguna berdasarkan no HP
                    const { data, error } = await db.from('profiles').select('*').eq('phone', authData.phone).single();
                    
                    if (data) {
                        setUserProfile(data); // Sudah terdaftar
                    } else {
                        // Belum terdaftar, buat baru
                        const newUser = {
                            name: authData.name,
                            phone: authData.phone,
                            role: authData.role,
                            status: 'Tersedia',
                            rating: 5.0,
                            reviews_count: 0
                        };
                        const { data: insertedData, error: insertError } = await db.from('profiles').insert([newUser]).select().single();
                        if (insertedData) setUserProfile(insertedData);
                    }
                } else {
                    // Mode Dummy
                    setUserProfile({
                        id: 'dummy-123',
                        name: authData.name,
                        phone: authData.phone,
                        role: authData.role,
                        location: '-',
                        skill: '-',
                        status: 'Tersedia',
                        rating: 5.0,
                        reviews_count: 0
                    });
                }
                
                setIsLoggedIn(true);
                setActiveTab('home');
                showNotification(`Selamat datang, ${authData.name}!`);
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setUserProfile({});
                setActiveTab('home');
                setAuthData({ name: '', phone: '', role: 'Pekerja / Pencari Kerja' });
                showNotification('Anda telah berhasil keluar.');
            };

            // FUNGSI: Update Profil
            const handleSaveProfile = async (e) => {
                e.preventDefault();
                if (isDbReady) {
                    const { error } = await db.from('profiles').update(editProfileData).eq('id', userProfile.id);
                    if (!error) {
                        setUserProfile({ ...userProfile, ...editProfileData });
                        fetchData(); // Perbarui daftar pekerja
                    }
                } else {
                    setUserProfile({ ...userProfile, ...editProfileData });
                }
                setShowEditProfile(false);
                showNotification('Data profil berhasil diperbarui!');
            };

            // FUNGSI: Buat Pekerjaan (Oleh Bos)
            const handleAddJob = async (e) => {
                e.preventDefault();
                if (!newJob.title) return;
                
                const jobData = {
                    title: newJob.title,
                    provider_name: userProfile.name,
                    wage: newJob.wage || '-',
                    location: newJob.location || '-',
                    status: 'Tersedia'
                };

                if (isDbReady) {
                    jobData.provider_id = userProfile.id;
                    const { data, error } = await db.from('jobs').insert([jobData]).select().single();
                    if (data) setJobs([data, ...jobs]);
                } else {
                    jobData.id = Date.now();
                    jobData.created_at = new Date().toISOString();
                    setJobs([jobData, ...jobs]);
                }
                
                setShowAddJob(false);
                setNewJob({ title: '', wage: '', location: '' });
                showNotification('Lowongan pekerjaan berhasil ditambahkan!');
            };

            // FUNGSI: Ambil Pekerjaan (Oleh Pekerja)
            const handleTakeJob = async (job) => {
                if (isDbReady) {
                    await db.from('jobs').update({ status: 'Diambil', worker_id: userProfile.id }).eq('id', job.id);
                    await db.from('profiles').update({ status: 'Sedang / Akan Bekerja' }).eq('id', userProfile.id);
                    fetchData();
                } else {
                    setJobs(jobs.map(j => j.id === job.id ? { ...j, status: 'Diambil' } : j));
                }
                setUserProfile(prev => ({ ...prev, status: 'Sedang / Akan Bekerja' }));
                setActiveJob(job);
                showNotification('Berhasil! Anda telah mengambil pekerjaan ini.');
            };

            // FUNGSI: Selesaikan Pekerjaan (Beri Rating)
            const handleFinishJob = async () => {
                if (isDbReady && activeJob) {
                    await db.from('jobs').update({ status: 'Selesai' }).eq('id', activeJob.id);
                    await db.from('profiles').update({ status: 'Tersedia' }).eq('id', userProfile.id);
                    
                    // Simpan Rating ke tabel reviews
                    if (ratingTarget.type === 'provider' && activeJob.provider_id) {
                         await db.from('reviews').insert([{ job_id: activeJob.id, reviewer_id: userProfile.id, target_id: activeJob.provider_id, rating: ratingValue }]);
                    }
                    fetchData();
                }

                setShowRatingModal(false);
                if (ratingTarget.type === 'provider') {
                    setActiveJob(null);
                    setUserProfile(prev => ({ ...prev, status: 'Tersedia' }));
                } else {
                    setActiveProviderJob(null);
                }
                showNotification(`Penilaian ${ratingValue} bintang telah dikirim. Terima kasih!`);
                setRatingValue(5);
            };

            // Render Rating UI
            const renderRating = (rating, reviews) => (
                <div className="flex items-center gap-1 mb-2">
                    <IconStar size={14} className="text-yellow-400" filled={true} />
                    <span className="text-sm font-bold text-gray-700">{Number(rating).toFixed(1)}</span>
                    <span className="text-xs text-gray-500">({reviews} ulasan)</span>
                </div>
            );

            // Tampilan Layar Utama (Konten)
            const renderContent = () => {
                switch (activeTab) {
                    case 'home':
                        return (
                            <div className="space-y-6">
                                {/* AREA BANNER LOGO */}
                                <div className="w-full rounded-3xl overflow-hidden shadow-sm bg-white border border-gray-100 flex items-center justify-center p-4">
                                    {/* Jika Anda sudah mengunggah logo ke Github, ubah src ini menjadi: src="./a4557300-bf49-447e-81c2-03ef054f585b.png" */}
                                    <img 
                                        src="https://images.unsplash.com/photo-1595841696677-6489ff3f8cd1?auto=format&fit=crop&w=1200&q=80" 
                                        alt="Banner Hayu Gawe" 
                                        className="w-full h-auto object-cover max-h-[250px] md:max-h-[400px] rounded-2xl"
                                    />
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="md:col-span-2 bg-green-600 rounded-3xl p-8 text-white shadow-lg flex flex-col justify-center relative overflow-hidden">
                                        <div className="relative z-10">
                                            <h2 className="text-3xl md:text-4xl font-bold mb-3">
                                                Selamat Datang di <span className="text-green-900 bg-white/20 px-2 py-1 rounded-lg">Hayu</span><span className="text-yellow-400 drop-shadow-md">Gawe</span>
                                            </h2>
                                            <p className="text-green-100 mb-6 text-lg">Pekerjaan Desa, Rezeki Urang Sadaya. {isDbReady ? 'Terhubung ke Database ✅' : ''}</p>
                                            <div className="flex flex-col sm:flex-row gap-3">
                                                <button onClick={() => setActiveTab('workers')} className="bg-white text-green-700 px-6 py-3 rounded-xl font-bold hover:bg-gray-50 transition text-center">
                                                    Cari Pekerja
                                                </button>
                                                <button onClick={() => setActiveTab('jobs')} className="bg-green-800 text-white px-6 py-3 rounded-xl font-bold border border-green-500 hover:bg-green-900 transition text-center">
                                                    Cari Kerja
                                                </button>
                                            </div>
                                        </div>
                                        <div className="absolute -right-10 -bottom-10 opacity-10 transform rotate-12">
                                            <IconUsers size={200} />
                                        </div>
                                    </div>

                                    <div className="bg-white p-6 rounded-3xl shadow-sm border border-gray-100 flex flex-col justify-center">
                                        <h3 className="font-bold text-gray-800 mb-4 text-xl">Statistik Desa Hari Ini</h3>
                                        <div className="space-y-4">
                                            <div className="bg-green-50 p-4 rounded-2xl border border-green-100 flex items-center justify-between">
                                                <div>
                                                    <div className="text-sm text-green-800 font-medium mb-1">Pekerja Tersedia</div>
                                                    <div className="text-3xl font-black text-green-600">{workers.filter(w => w.status === 'Tersedia').length}</div>
                                                </div>
                                                <IconUsers size={40} className="text-green-200" />
                                            </div>
                                            <div className="bg-orange-50 p-4 rounded-2xl border border-orange-100 flex items-center justify-between">
                                                <div>
                                                    <div className="text-sm text-orange-800 font-medium mb-1">Lowongan Aktif</div>
                                                    <div className="text-3xl font-black text-orange-500">{jobs.filter(j => j.status === 'Tersedia').length}</div>
                                                </div>
                                                <IconBriefcase size={40} className="text-orange-200" />
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    
                    case 'workers':
                        const filteredWorkers = workers.filter(w => {
                            const skill = w.skill || '';
                            const name = w.name || '';
                            const matchSearch = skill.toLowerCase().includes(searchWorker.toLowerCase()) || name.toLowerCase().includes(searchWorker.toLowerCase());
                            const matchFilter = activeFilter === 'Semua' || skill.toLowerCase().includes(activeFilter.toLowerCase());
                            return matchSearch && matchFilter;
                        });

                        return (
                            <div className="pb-24 md:pb-8 space-y-6">
                                <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                    <h2 className="text-2xl font-bold text-gray-800">Daftar Pekerja Desa</h2>
                                    <div className="relative shadow-sm w-full md:w-1/3">
                                        <IconSearch size={18} className="absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400" />
                                        <input 
                                            type="text" placeholder="Cari keahlian (misal: panen)..." 
                                            className="w-full pl-11 pr-4 py-3 border border-gray-200 rounded-xl text-sm outline-none focus:border-green-500"
                                            value={searchWorker} onChange={(e) => setSearchWorker(e.target.value)}
                                        />
                                    </div>
                                </div>

                                <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                                    {filterCategories.map(cat => (
                                        <button key={cat} onClick={() => setActiveFilter(cat)}
                                            className={`px-5 py-2.5 rounded-full text-sm font-bold whitespace-nowrap ${activeFilter === cat ? 'bg-green-600 text-white' : 'bg-white text-gray-600 border border-gray-200'}`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {filteredWorkers.length > 0 ? filteredWorkers.map(worker => (
                                        <div key={worker.id} className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                                            <div className="flex justify-between items-start mb-2">
                                                <h3 className="font-bold text-xl text-gray-800">{worker.name}</h3>
                                                <span className={`text-xs px-3 py-1.5 rounded-full font-bold ${worker.status === 'Tersedia' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}`}>
                                                    {worker.status}
                                                </span>
                                            </div>
                                            {renderRating(worker.rating, worker.reviews_count)}
                                            <div className="bg-gray-50 p-3 rounded-xl mt-3 mb-4">
                                                <p className="text-sm text-gray-700 flex items-start gap-2 mb-2">
                                                    <IconBriefcase size={16} className="text-green-600 shrink-0 mt-0.5" /> 
                                                    <span className="font-medium">{worker.skill || 'Belum diisi'}</span>
                                                </p>
                                                <p className="text-sm text-gray-600 flex items-center gap-2">
                                                    <IconMapPin size={16} className="text-gray-400 shrink-0" /> {worker.location || '-'}
                                                </p>
                                            </div>
                                            <button onClick={() => showNotification('Membuka WhatsApp...')}
                                                className="w-full bg-green-50 text-green-700 font-bold py-3 rounded-xl flex items-center justify-center gap-2 hover:bg-green-100"
                                            >
                                                <IconPhone size={18} /> Hubungi via WA
                                            </button>
                                        </div>
                                    )) : (
                                        <div className="col-span-full text-center py-12 bg-gray-50 rounded-2xl border-2 border-dashed border-gray-200">
                                            <p className="text-gray-500 font-medium">Tidak ada pekerja yang sesuai kriteria.</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        );

                    case 'jobs':
                        return (
                            <div className="pb-24 md:pb-8 space-y-6">
                                <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-4">
                                    <h2 className="text-2xl font-bold text-gray-800">Papan Lowongan Kerja</h2>
                                    {userProfile.role === 'Penyedia Kerja' && (
                                        <button onClick={() => setShowAddJob(true)}
                                            className="bg-green-600 text-white px-5 py-3 rounded-xl flex items-center justify-center gap-2 text-sm font-bold shadow-sm hover:bg-green-700"
                                        >
                                            <IconPlusCircle size={18} /> Buat Lowongan Baru
                                        </button>
                                    )}
                                </div>

                                {showAddJob && (
                                    <div className="bg-white p-6 rounded-2xl shadow-lg border border-green-200 relative mb-6">
                                        <button onClick={() => setShowAddJob(false)} className="absolute top-4 right-4 text-gray-400 hover:text-gray-600"><IconX size={24} /></button>
                                        <h3 className="text-xl font-bold text-green-700 mb-4">Tambah Lowongan Baru</h3>
                                        <form onSubmit={handleAddJob} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div className="md:col-span-2">
                                                <label className="block text-sm font-bold text-gray-700 mb-1.5">Judul Pekerjaan</label>
                                                <input type="text" placeholder="Contoh: Kuli Panggul Beras" required className="w-full p-3 border border-gray-300 rounded-xl text-sm" value={newJob.title} onChange={e => setNewJob({...newJob, title: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1.5">Upah (Rp)</label>
                                                <input type="text" placeholder="Contoh: Rp 80.000 / hari" className="w-full p-3 border border-gray-300 rounded-xl text-sm" value={newJob.wage} onChange={e => setNewJob({...newJob, wage: e.target.value})} />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-bold text-gray-700 mb-1.5">Lokasi Kerja</label>
                                                <input type="text" placeholder="Contoh: Gudang Desa" className="w-full p-3 border border-gray-300 rounded-xl text-sm" value={newJob.location} onChange={e => setNewJob({...newJob, location: e.target.value})} />
                                            </div>
                                            <div className="md:col-span-2 mt-2">
                                                <button type="submit" className="w-full bg-green-600 text-white font-bold py-3.5 rounded-xl hover:bg-green-700 transition">Posting Pekerjaan</button>
                                            </div>
                                        </form>
                                    </div>
                                )}

                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {jobs.map(job => (
                                        <div key={job.id} className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col">
                                            <div className="flex justify-between items-start mb-2">
                                                <h3 className="font-bold text-xl text-gray-800">{job.title}</h3>
                                                <span className={`text-xs px-3 py-1.5 rounded-full font-bold whitespace-nowrap ml-2 ${job.status === 'Tersedia' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'}`}>
                                                    {job.status}
                                                </span>
                                            </div>
                                            
                                            <div className="flex items-center gap-2 mb-4">
                                                <div className="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center border border-gray-200">
                                                    <IconUser size={14} className="text-gray-500" />
                                                </div>
                                                <div>
                                                    <p className="text-sm text-gray-700 font-bold">{job.provider_name}</p>
                                                </div>
                                            </div>
                                            
                                            <div className="bg-orange-50 p-3 rounded-xl border border-orange-100 mb-3">
                                                <span className="block text-orange-800 font-bold text-xs uppercase mb-1">Upah</span>
                                                <span className="text-orange-600 font-semibold">{job.wage}</span>
                                            </div>
                                            <div className="bg-gray-50 p-3 rounded-xl mb-5 flex items-center gap-2">
                                                <IconMapPin size={16} className="text-gray-400 shrink-0" /> 
                                                <span className="text-sm text-gray-700 font-medium">{job.location}</span>
                                            </div>

                                            <div className="mt-auto">
                                                {userProfile.role === 'Pekerja / Pencari Kerja' && job.status === 'Tersedia' ? (
                                                    <button onClick={() => handleTakeJob(job)} className="w-full bg-green-600 text-white font-bold py-3 rounded-xl hover:bg-green-700 transition">
                                                        Ambil Pekerjaan Ini
                                                    </button>
                                                ) : (
                                                    <button disabled className="w-full bg-gray-100 text-gray-400 font-bold py-3 rounded-xl cursor-not-allowed">
                                                        {job.status === 'Tersedia' ? 'Hanya Pekerja Yang Bisa Mengambil' : 'Pekerjaan Telah Diambil'}
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        );

                    case 'profile':
                        return (
                            <div className="pb-24 md:pb-8">
                                <div className="flex justify-between items-center mb-6">
                                    <h2 className="text-2xl font-bold text-gray-800">Profil Saya</h2>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="md:col-span-1 space-y-6">
                                        <div className="bg-white rounded-3xl p-8 shadow-sm border border-gray-100 text-center relative overflow-hidden">
                                            <div className="absolute top-0 left-0 w-full h-24 bg-green-600"></div>
                                            <div className="relative w-32 h-32 bg-white rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-white shadow-lg mt-4 z-10">
                                                <IconUser size={60} className="text-green-600" />
                                            </div>
                                            <h3 className="text-2xl font-black text-gray-800">{userProfile.name}</h3>
                                            
                                            <div className="flex items-center justify-center gap-1 my-3 bg-yellow-50 mx-auto w-max px-4 py-1.5 rounded-full border border-yellow-100">
                                                <IconStar size={18} className="text-yellow-400" filled={true} />
                                                <span className="text-lg font-bold text-yellow-700">{Number(userProfile.rating || 5).toFixed(1)}</span>
                                                <span className="text-sm text-yellow-600 font-medium ml-1">({userProfile.reviews_count || 0} ulasan)</span>
                                            </div>

                                            <div className="flex flex-col gap-2 mt-4">
                                                <span className="inline-block bg-green-50 text-green-800 px-4 py-2 rounded-xl font-bold border border-green-100">{userProfile.role}</span>
                                                <span className={`inline-block px-4 py-2 rounded-xl font-bold border ${userProfile.status === 'Tersedia' ? 'bg-blue-50 text-blue-700 border-blue-200' : 'bg-orange-50 text-orange-700 border-orange-200'}`}>
                                                    Status: {userProfile.status}
                                                </span>
                                            </div>
                                        </div>

                                        <div className="bg-white rounded-3xl shadow-sm border border-gray-100 p-6 space-y-5">
                                            <h4 className="font-bold text-gray-800 border-b border-gray-100 pb-3">Informasi Detail</h4>
                                            {userProfile.role === 'Pekerja / Pencari Kerja' && (
                                                <div>
                                                    <label className="text-xs text-gray-500 font-bold uppercase">Keahlian Saya</label>
                                                    <p className="text-gray-800 font-medium mt-1 bg-gray-50 p-3 rounded-lg border border-gray-100">{userProfile.skill || '-'}</p>
                                                </div>
                                            )}
                                            <div>
                                                <label className="text-xs text-gray-500 font-bold uppercase">Lokasi Domisili</label>
                                                <p className="text-gray-800 font-medium mt-1 bg-gray-50 p-3 rounded-lg border border-gray-100">{userProfile.location || '-'}</p>
                                            </div>
                                            <div>
                                                <label className="text-xs text-gray-500 font-bold uppercase">Nomor WhatsApp</label>
                                                <p className="text-gray-800 font-medium mt-1 bg-gray-50 p-3 rounded-lg border border-gray-100">{userProfile.phone || '-'}</p>
                                            </div>
                                            
                                            <button onClick={() => { setEditProfileData(userProfile); setShowEditProfile(true); }} className="w-full mt-4 bg-white border-2 border-green-600 text-green-700 font-bold py-3 rounded-xl hover:bg-green-50 transition">
                                                Ubah Data Profil
                                            </button>
                                            <button onClick={handleLogout} className="w-full mt-3 bg-red-50 text-red-600 font-bold py-3 rounded-xl hover:bg-red-100 transition">
                                                Keluar Akun
                                            </button>
                                        </div>
                                    </div>

                                    {/* Kolom Kanan: Aktivitas Aktif */}
                                    <div className="md:col-span-2 space-y-6">
                                        <div className="bg-white rounded-3xl shadow-sm border border-gray-100 p-6 min-h-[400px]">
                                            <h3 className="text-xl font-bold text-gray-800 mb-6 border-b border-gray-100 pb-4">Aktivitas Saat Ini</h3>

                                            {userProfile.role === 'Pekerja / Pencari Kerja' && activeJob ? (
                                                <div className="bg-orange-50 border border-orange-200 rounded-2xl p-6 shadow-sm relative overflow-hidden">
                                                    <div className="absolute top-0 left-0 w-2 h-full bg-orange-500"></div>
                                                    <h4 className="font-bold text-orange-800 text-sm uppercase mb-4 bg-orange-100 px-3 py-1 rounded-full w-max">Sedang Dikerjakan</h4>
                                                    <p className="font-black text-gray-800 text-2xl mb-2">{activeJob.title}</p>
                                                    <p className="text-gray-600 mb-6">Penyedia: <strong>{activeJob.provider_name}</strong></p>
                                                    <button onClick={() => { setRatingTarget({ type: 'provider', name: activeJob.provider_name }); setShowRatingModal(true); }}
                                                        className="w-full sm:w-auto bg-orange-600 text-white font-bold py-3 px-8 rounded-xl hover:bg-orange-700 shadow-md transition"
                                                    >
                                                        Selesaikan & Beri Rating Penyedia
                                                    </button>
                                                </div>
                                            ) : userProfile.role === 'Penyedia Kerja' && activeProviderJob ? (
                                                <div className="bg-blue-50 border border-blue-200 rounded-2xl p-6 shadow-sm relative overflow-hidden">
                                                    <div className="absolute top-0 left-0 w-2 h-full bg-blue-500"></div>
                                                    <h4 className="font-bold text-blue-800 text-sm uppercase mb-4 bg-blue-100 px-3 py-1 rounded-full w-max">Proyek Berjalan</h4>
                                                    <p className="font-black text-gray-800 text-2xl mb-2">{activeProviderJob.title}</p>
                                                    <p className="text-gray-600 mb-6">Dikerjakan oleh: <strong>{activeProviderJob.worker_name}</strong></p>
                                                    <button onClick={() => { setRatingTarget({ type: 'worker', name: activeProviderJob.worker_name }); setShowRatingModal(true); }}
                                                        className="w-full sm:w-auto bg-blue-600 text-white font-bold py-3 px-8 rounded-xl hover:bg-blue-700 shadow-md transition"
                                                    >
                                                        Tandai Selesai & Nilai Pekerja
                                                    </button>
                                                </div>
                                            ) : (
                                                <div className="h-48 flex flex-col items-center justify-center text-center p-6 border-2 border-dashed border-gray-200 rounded-2xl bg-gray-50">
                                                    <IconBriefcase size={48} className="text-gray-300 mb-3" />
                                                    <p className="text-gray-500 font-medium text-lg">Tidak ada aktivitas saat ini.</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    default: return null;
                }
            };

            // LAYAR LOGIN
            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4 font-sans">
                        {message && (
                            <div className="fixed top-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full text-sm font-bold z-50 shadow-2xl animate-bounce">
                                {message}
                            </div>
                        )}
                        
                        <div className="w-full max-w-5xl bg-white rounded-3xl shadow-2xl flex overflow-hidden border border-gray-100 min-h-[600px]">
                            {/* Kiri (Desktop) */}
                            <div className="hidden md:flex w-1/2 bg-green-50 flex-col items-center justify-center p-12 relative">
                                <div className="z-10 text-center">
                                    {/* Jika Anda sudah mengunggah logo ke Github, ubah src ini menjadi: src="./a4557300-bf49-447e-81c2-03ef054f585b.png" */}
                                    <img src="https://images.unsplash.com/photo-1595841696677-6489ff3f8cd1?auto=format&fit=crop&w=600&q=80" alt="Ilustrasi Desa" className="w-full max-w-sm rounded-2xl shadow-xl border-4 border-white mb-8" />
                                    <h2 className="text-3xl font-black text-green-800 mb-3">Pekerjaan Desa,<br/>Rezeki Urang Sadaya.</h2>
                                    <p className="text-green-700 font-medium text-lg">Menghubungkan warga desa untuk gotong royong mencari rezeki.</p>
                                </div>
                            </div>
                            
                            {/* Kanan (Form Login) */}
                            <div className="w-full md:w-1/2 p-8 sm:p-12 flex flex-col justify-center">
                                <div className="text-center mb-8 md:text-left">
                                    <div className="w-16 h-16 bg-green-100 rounded-2xl flex items-center justify-center mb-6 md:mx-0 mx-auto">
                                        <IconUserPlus size={32} className="text-green-700" />
                                    </div>
                                    <h1 className="text-4xl font-black tracking-tight mb-2">
                                        <span className="text-green-800">Hayu</span><span className="text-yellow-500">Gawe</span>
                                    </h1>
                                    <p className="text-gray-500 font-medium">Masuk atau daftar dengan Nomor WA</p>
                                    
                                    {!isDbReady && (
                                        <div className="mt-4 p-3 bg-red-50 border border-red-200 text-red-700 text-xs font-bold rounded-lg">
                                            Status: Offline Mode (Kunci Supabase belum diubah). Data yang masuk saat ini hanya data bohongan.
                                        </div>
                                    )}
                                </div>

                                <form onSubmit={handleLogin} className="space-y-5">
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-2">Nama Lengkap</label>
                                        <input type="text" required placeholder="Contoh: Kang Asep" className="w-full p-4 border-2 border-gray-200 rounded-xl outline-none focus:border-green-500 bg-gray-50" value={authData.name} onChange={e => setAuthData({...authData, name: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-2">Nomor WhatsApp</label>
                                        <input type="tel" required placeholder="Contoh: 0812xxxx" className="w-full p-4 border-2 border-gray-200 rounded-xl outline-none focus:border-green-500 bg-gray-50" value={authData.phone} onChange={e => setAuthData({...authData, phone: e.target.value})} />
                                    </div>
                                    <div className="pt-2">
                                        <label className="block text-sm font-bold text-gray-700 mb-3">Tujuan saya...</label>
                                        <div className="grid grid-cols-2 gap-4">
                                            <label className={`border-2 p-4 rounded-xl text-center text-sm font-bold cursor-pointer ${authData.role === 'Pekerja / Pencari Kerja' ? 'bg-green-50 border-green-500 text-green-700 shadow-md' : 'bg-white border-gray-200 text-gray-500'}`}>
                                                <input type="radio" name="role" className="hidden" checked={authData.role === 'Pekerja / Pencari Kerja'} onChange={() => setAuthData({...authData, role: 'Pekerja / Pencari Kerja'})} />
                                                Mencari Kerja
                                            </label>
                                            <label className={`border-2 p-4 rounded-xl text-center text-sm font-bold cursor-pointer ${authData.role === 'Penyedia Kerja' ? 'bg-blue-50 border-blue-500 text-blue-700 shadow-md' : 'bg-white border-gray-200 text-gray-500'}`}>
                                                <input type="radio" name="role" className="hidden" checked={authData.role === 'Penyedia Kerja'} onChange={() => setAuthData({...authData, role: 'Penyedia Kerja'})} />
                                                Cari Pekerja
                                            </label>
                                        </div>
                                    </div>
                                    <button type="submit" className="w-full bg-green-600 text-white font-black py-4 rounded-xl hover:bg-green-700 transition mt-6 shadow-lg">Mulai Gunakan HayuGawe</button>
                                </form>
                            </div>
                        </div>
                    </div>
                );
            }

            // LAYAR UTAMA (SETELAH LOGIN)
            return (
                <div className="min-h-screen bg-gray-50 flex flex-col font-sans text-gray-900">
                    {/* Navbar Atas */}
                    <header className="bg-white shadow-sm sticky top-0 z-40 border-b border-gray-100">
                        <div className="max-w-7xl mx-auto px-4 h-16 sm:h-20 flex items-center justify-between">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab('home')}>
                                <div className="w-10 h-10 bg-green-100 rounded-xl flex items-center justify-center">
                                    <IconUserPlus size={24} className="text-green-700" />
                                </div>
                                <h1 className="text-2xl font-black tracking-tight"><span className="text-green-800">Hayu</span><span className="text-yellow-500">Gawe</span></h1>
                            </div>
                            <div className="hidden md:flex items-center gap-1">
                                <button onClick={() => setActiveTab('home')} className={`px-5 py-2.5 rounded-lg font-bold text-sm ${activeTab === 'home' ? 'bg-green-50 text-green-700' : 'text-gray-500'}`}>Beranda</button>
                                <button onClick={() => setActiveTab('workers')} className={`px-5 py-2.5 rounded-lg font-bold text-sm ${activeTab === 'workers' ? 'bg-green-50 text-green-700' : 'text-gray-500'}`}>Daftar Pekerja</button>
                                <button onClick={() => setActiveTab('jobs')} className={`px-5 py-2.5 rounded-lg font-bold text-sm ${activeTab === 'jobs' ? 'bg-green-50 text-green-700' : 'text-gray-500'}`}>Lowongan Kerja</button>
                                <div className="w-px h-6 bg-gray-200 mx-2"></div>
                                <button onClick={() => setActiveTab('profile')} className={`flex items-center gap-2 px-5 py-2.5 rounded-lg font-bold text-sm border ${activeTab === 'profile' ? 'bg-white border-green-200 text-green-700 shadow-sm' : 'bg-white border-gray-200 text-gray-700'}`}>
                                    <IconUser size={18} className={activeTab === 'profile' ? 'text-green-600' : 'text-gray-400'} /> Profil Saya
                                </button>
                            </div>
                        </div>
                    </header>

                    {message && (
                        <div className="fixed top-24 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full text-sm font-bold z-50 shadow-xl flex items-center gap-2">
                            <div className="w-2 h-2 bg-green-400 rounded-full animate-pulse"></div>
                            {message}
                        </div>
                    )}

                    <main className="flex-1 w-full max-w-7xl mx-auto p-4 sm:p-6 lg:p-8">
                        {renderContent()}
                    </main>

                    {/* MODAL EDIT PROFIL */}
                    {showEditProfile && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl relative max-h-[90vh] overflow-y-auto">
                                <button onClick={() => setShowEditProfile(false)} className="absolute top-5 right-5 text-gray-400"><IconX size={20} /></button>
                                <h3 className="text-2xl font-black text-gray-800 mb-6 text-center">Ubah Data Profil</h3>
                                <form onSubmit={handleSaveProfile} className="space-y-5">
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-2">Nama Lengkap</label>
                                        <input type="text" required className="w-full p-4 border-2 border-gray-200 rounded-xl outline-none focus:border-green-500 bg-gray-50" value={editProfileData.name || ''} onChange={e => setEditProfileData({...editProfileData, name: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-2">Nomor WhatsApp</label>
                                        <input type="tel" required className="w-full p-4 border-2 border-gray-200 rounded-xl outline-none focus:border-green-500 bg-gray-50" value={editProfileData.phone || ''} onChange={e => setEditProfileData({...editProfileData, phone: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-2">Lokasi (Dusun/RT/RW)</label>
                                        <input type="text" required className="w-full p-4 border-2 border-gray-200 rounded-xl outline-none focus:border-green-500 bg-gray-50" value={editProfileData.location || ''} onChange={e => setEditProfileData({...editProfileData, location: e.target.value})} />
                                    </div>
                                    {userProfile.role === 'Pekerja / Pencari Kerja' && (
                                        <div>
                                            <label className="block text-sm font-bold text-gray-700 mb-2">Keahlian Saya</label>
                                            <textarea className="w-full p-4 border-2 border-gray-200 rounded-xl outline-none focus:border-green-500 bg-gray-50 resize-none" rows="3" value={editProfileData.skill || ''} onChange={e => setEditProfileData({...editProfileData, skill: e.target.value})} placeholder="Contoh: Mencangkul, Panen Padi"></textarea>
                                        </div>
                                    )}
                                    <button type="submit" className="w-full bg-green-600 text-white font-black py-4 rounded-xl hover:bg-green-700 transition mt-4">Simpan Perubahan</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL RATING */}
                    {showRatingModal && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl relative">
                                <button onClick={() => setShowRatingModal(false)} className="absolute top-5 right-5 text-gray-400"><IconX size={20} /></button>
                                <h3 className="text-2xl font-black text-center text-gray-800 mb-2">Pekerjaan Selesai! 🎉</h3>
                                <p className="text-base text-center text-gray-500 mb-8">
                                    Beri nilai untuk <span className="font-bold text-gray-800 bg-gray-100 px-2 py-0.5 rounded">{ratingTarget?.name}</span>
                                </p>
                                <div className="flex justify-center gap-3 mb-8 bg-gray-50 p-4 rounded-2xl border border-gray-100">
                                    {[1, 2, 3, 4, 5].map((star) => (
                                        <button key={star} onClick={() => setRatingValue(star)} className="focus:outline-none transition-transform hover:scale-125">
                                            <IconStar size={48} filled={star <= ratingValue} className={star <= ratingValue ? "text-yellow-400 drop-shadow-md" : "text-gray-300"} />
                                        </button>
                                    ))}
                                </div>
                                <button onClick={handleFinishJob} className="w-full bg-green-600 text-white font-black py-4 rounded-xl hover:bg-green-700 transition shadow-lg text-lg">
                                    Kirim Penilaian
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Navbar Bawah (Mobile) */}
                    <nav className="md:hidden bg-white border-t border-gray-200 fixed bottom-0 w-full pb-safe z-40">
                        <div className="flex justify-around items-center p-2">
                            <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center justify-center w-16 h-14 rounded-xl ${activeTab === 'home' ? 'text-green-700 bg-green-50' : 'text-gray-400'}`}>
                                <IconHome size={22} className={activeTab === 'home' ? 'mb-1' : ''} />
                                <span className={`text-[10px] font-bold ${activeTab === 'home' ? 'block' : 'hidden'}`}>Beranda</span>
                            </button>
                            <button onClick={() => setActiveTab('workers')} className={`flex flex-col items-center justify-center w-16 h-14 rounded-xl ${activeTab === 'workers' ? 'text-green-700 bg-green-50' : 'text-gray-400'}`}>
                                <IconUsers size={22} className={activeTab === 'workers' ? 'mb-1' : ''} />
                                <span className={`text-[10px] font-bold ${activeTab === 'workers' ? 'block' : 'hidden'}`}>Pekerja</span>
                            </button>
                            <button onClick={() => setActiveTab('jobs')} className={`flex flex-col items-center justify-center w-16 h-14 rounded-xl ${activeTab === 'jobs' ? 'text-green-700 bg-green-50' : 'text-gray-400'}`}>
                                <IconBriefcase size={22} className={activeTab === 'jobs' ? 'mb-1' : ''} />
                                <span className={`text-[10px] font-bold ${activeTab === 'jobs' ? 'block' : 'hidden'}`}>Lowongan</span>
                            </button>
                            <button onClick={() => setActiveTab('profile')} className={`flex flex-col items-center justify-center w-16 h-14 rounded-xl ${activeTab === 'profile' ? 'text-green-700 bg-green-50' : 'text-gray-400'}`}>
                                <IconUser size={22} className={activeTab === 'profile' ? 'mb-1' : ''} />
                                <span className={`text-[10px] font-bold ${activeTab === 'profile' ? 'block' : 'hidden'}`}>Profil</span>
                            </button>
                        </div>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
